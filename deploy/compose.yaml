# Cardboard stack for minicore. Copy this directory to chriscorbell/stacks/cardboard and run
# `docker compose up -d`. Watchtower updates app, runner, egress, and preview-router on each push
# to main; session and preview containers carry the opt-out label and are managed by the runner.
#
# Networks: `control` carries app <-> runner <-> egress traffic. `workload` is where session and
# preview containers live; they can reach app (MCP) and egress but never the runner.

name: cardboard

services:
  app:
    image: ghcr.io/chriscorbell/cardboard-app:latest
    restart: unless-stopped
    init: true
    ports:
      - "3070:3070"
    environment:
      TZ: America/New_York
      CARDBOARD_AUTH: clerk
      CARDBOARD_PUBLIC_URL: https://cardboard.xode.cc
      CARDBOARD_ADMIN_EMAIL: ${CARDBOARD_ADMIN_EMAIL}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
      CARDBOARD_EMAIL_FROM: "Milo <milo@cardboard.xode.cc>"
      CARDBOARD_RUNNER_URL: http://runner:3071
      CARDBOARD_RUNNER_TOKEN: ${CARDBOARD_RUNNER_TOKEN}
      GITHUB_SESSIONS_APP_ID: ${GITHUB_SESSIONS_APP_ID}
      GITHUB_SESSIONS_APP_SLUG: ${GITHUB_SESSIONS_APP_SLUG}
      GITHUB_SESSIONS_APP_PRIVATE_KEY_B64: ${GITHUB_SESSIONS_APP_PRIVATE_KEY_B64}
      GITHUB_MERGE_APP_ID: ${GITHUB_MERGE_APP_ID}
      GITHUB_MERGE_APP_SLUG: ${GITHUB_MERGE_APP_SLUG}
      GITHUB_MERGE_APP_PRIVATE_KEY_B64: ${GITHUB_MERGE_APP_PRIVATE_KEY_B64}
    volumes:
      - ../../data/cardboard/app:/data
    networks: [control, workload]

  runner:
    image: ghcr.io/chriscorbell/cardboard-runner:latest
    restart: unless-stopped
    init: true
    environment:
      CARDBOARD_RUNNER_TOKEN: ${CARDBOARD_RUNNER_TOKEN}
      CARDBOARD_APP_URL: http://app:3070
      CARDBOARD_MCP_URL: http://app:3070/mcp
      CARDBOARD_EGRESS_URL: http://egress:8787
      CARDBOARD_WORKLOAD_NETWORK: cardboard_workload
      CARDBOARD_LOG_DIR: /data/logs
      # Set once the egress proxy below holds the Codex sign-in file; then Session containers get
      # no Codex credential of their own. Leave empty to fall back to mounting the file into them.
      CARDBOARD_CODEX_VIA_EGRESS: ${CARDBOARD_CODEX_VIA_EGRESS:-}
      # A path on the Docker host, not in this container: the runner only names it in a bind.
      CODEX_AUTH_FILE: ${CARDBOARD_CODEX_AUTH_FILE:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../../data/cardboard/runner:/data
    networks: [control]

  egress:
    image: ghcr.io/chriscorbell/cardboard-egress:latest
    restart: unless-stopped
    init: true
    environment:
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN}
      # A path in this container. The whole directory is mounted, not the one file, because the
      # proxy replaces the file when it refreshes the access token and a rename needs the directory.
      CODEX_AUTH_FILE: ${CARDBOARD_CODEX_AUTH_FILE:+/secrets/codex-auth.json}
    volumes:
      - ../../data/cardboard/secrets:/secrets
    networks: [control, workload]

  preview-router:
    image: ghcr.io/chriscorbell/cardboard-preview-router:latest
    restart: unless-stopped
    init: true
    ports:
      - "3073:3072"
    environment:
      CARDBOARD_APP_URL: http://app:3070
      CARDBOARD_PUBLIC_URL: https://cardboard.xode.cc
      CARDBOARD_RUNNER_TOKEN: ${CARDBOARD_RUNNER_TOKEN}
      CARDBOARD_PREVIEW_SECRET: ${CARDBOARD_PREVIEW_SECRET}
    networks: [control, workload]

networks:
  control:
  workload:
    name: cardboard_workload
